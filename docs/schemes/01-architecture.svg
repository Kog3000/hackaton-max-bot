<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Gilroy, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475578"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#264ffc"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#fafbfd"/>

  <text x="64" y="76" font-size="38" font-weight="700" fill="#0c1427">Архитектура</text>
  <text x="64" y="112" font-size="20" fill="#697592">Один образ, три процесса, одна база. Запуск: docker compose up --build</text>

  <!-- MAX -->
  <rect x="64" y="170" width="330" height="560" rx="28" fill="#ebf1fe" stroke="#264ffc" stroke-width="2"/>
  <text x="229" y="214" font-size="24" font-weight="700" fill="#264ffc" text-anchor="middle">MAX</text>

  <rect x="100" y="240" width="258" height="128" rx="20" fill="#ffffff" stroke="#d6dae2" stroke-width="2"/>
  <text x="229" y="286" font-size="21" font-weight="700" fill="#0c1427" text-anchor="middle">Пользователь</text>
  <text x="229" y="316" font-size="17" fill="#697592" text-anchor="middle">чат с ботом</text>
  <text x="229" y="342" font-size="17" fill="#697592" text-anchor="middle">и мини-приложение</text>

  <rect x="100" y="404" width="258" height="124" rx="20" fill="#ffffff" stroke="#d6dae2" stroke-width="2"/>
  <text x="229" y="446" font-size="20" font-weight="700" fill="#0c1427" text-anchor="middle">MAX Bridge</text>
  <text x="229" y="476" font-size="16" fill="#697592" text-anchor="middle">initData, start_param,</text>
  <text x="229" y="498" font-size="16" fill="#697592" text-anchor="middle">shareMaxContent</text>

  <rect x="100" y="564" width="258" height="124" rx="20" fill="#ffffff" stroke="#d6dae2" stroke-width="2"/>
  <text x="229" y="606" font-size="20" font-weight="700" fill="#0c1427" text-anchor="middle">MAX Bot API</text>
  <text x="229" y="636" font-size="16" fill="#697592" text-anchor="middle">long polling,</text>
  <text x="229" y="658" font-size="16" fill="#697592" text-anchor="middle">отправка сообщений</text>

  <path d="M229 368 L229 400" stroke="#264ffc" stroke-width="2.5" fill="none" marker-end="url(#ab)" marker-start="url(#ab)"/>
  <path d="M229 528 L229 560" stroke="#264ffc" stroke-width="2.5" fill="none" marker-end="url(#ab)" marker-start="url(#ab)"/>

  <!-- server -->
  <rect x="520" y="170" width="1016" height="560" rx="28" fill="#ffffff" stroke="#d6dae2" stroke-width="2"/>
  <text x="556" y="214" font-size="24" font-weight="700" fill="#0c1427">Наш сервер · docker compose</text>

  <rect x="556" y="240" width="344" height="140" rx="20" fill="#f3f6f9" stroke="#475578" stroke-width="2"/>
  <text x="728" y="282" font-size="22" font-weight="700" fill="#0c1427" text-anchor="middle">web</text>
  <text x="728" y="312" font-size="16" fill="#697592" text-anchor="middle">FastAPI + Jinja2 · страницы,</text>
  <text x="728" y="334" font-size="16" fill="#697592" text-anchor="middle">формы, админка,</text>
  <text x="728" y="356" font-size="16" fill="#697592" text-anchor="middle">проверка подписи initData</text>

  <rect x="556" y="400" width="344" height="132" rx="20" fill="#f3f6f9" stroke="#475578" stroke-width="2"/>
  <text x="728" y="442" font-size="22" font-weight="700" fill="#0c1427" text-anchor="middle">bot</text>
  <text x="728" y="472" font-size="16" fill="#697592" text-anchor="middle">maxo, long polling</text>
  <text x="728" y="494" font-size="16" fill="#697592" text-anchor="middle">/start /demo /admin</text>
  <text x="728" y="516" font-size="16" fill="#697592" text-anchor="middle">/reply /help, кнопки</text>

  <rect x="556" y="552" width="344" height="140" rx="20" fill="#f3f6f9" stroke="#475578" stroke-width="2"/>
  <text x="728" y="594" font-size="22" font-weight="700" fill="#0c1427" text-anchor="middle">worker</text>
  <text x="728" y="624" font-size="16" fill="#697592" text-anchor="middle">цикл раз в 15 секунд,</text>
  <text x="728" y="646" font-size="16" fill="#697592" text-anchor="middle">четыре повода написать,</text>
  <text x="728" y="668" font-size="16" fill="#697592" text-anchor="middle">ключи идемпотентности</text>

  <rect x="940" y="240" width="560" height="196" rx="20" fill="#ebf1fe" stroke="#264ffc" stroke-width="2"/>
  <text x="1220" y="290" font-size="22" font-weight="700" fill="#0c1427" text-anchor="middle">Общий домен</text>
  <text x="1220" y="322" font-size="17" fill="#475578" text-anchor="middle">app/domain.py · app/services.py</text>
  <text x="1220" y="356" font-size="17" fill="#697592" text-anchor="middle">правила повторения льготных дней,</text>
  <text x="1220" y="380" font-size="17" fill="#697592" text-anchor="middle">подбор получателей, запросы к базе.</text>
  <text x="1220" y="410" font-size="17" fill="#697592" text-anchor="middle">Один и тот же код у всех трёх процессов</text>

  <rect x="940" y="496" width="560" height="196" rx="20" fill="#f3f6f9" stroke="#475578" stroke-width="2"/>
  <text x="1220" y="546" font-size="22" font-weight="700" fill="#0c1427" text-anchor="middle">PostgreSQL 16</text>
  <text x="1220" y="582" font-size="17" fill="#697592" text-anchor="middle">8 таблиц: люди, площадки, окна записи,</text>
  <text x="1220" y="606" font-size="17" fill="#697592" text-anchor="middle">льготные правила, подписки,</text>
  <text x="1220" y="630" font-size="17" fill="#697592" text-anchor="middle">напоминания, отправленное, журнал правок</text>
  <text x="1220" y="664" font-size="17" fill="#475578" text-anchor="middle">Миграции идемпотентны, идут при старте web</text>

  <!-- MAX ↔ server -->
  <path d="M358 440 L552 300" stroke="#264ffc" stroke-width="2.5" fill="none" marker-end="url(#ab)" marker-start="url(#ab)"/>
  <path d="M358 594 L552 452" stroke="#264ffc" stroke-width="2.5" fill="none" marker-end="url(#ab)" marker-start="url(#ab)"/>
  <path d="M552 640 L362 656" stroke="#264ffc" stroke-width="2.5" fill="none" marker-end="url(#ab)"/>

  <!-- internal -->
  <path d="M904 300 L936 310" stroke="#475578" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M904 466 L936 400" stroke="#475578" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M904 600 L936 424" stroke="#475578" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M1220 436 L1220 492" stroke="#475578" stroke-width="2.5" fill="none" marker-end="url(#a)" marker-start="url(#a)"/>

  <text x="64" y="790" font-size="19" font-weight="700" fill="#0c1427">Почему так</text>
  <text x="64" y="822" font-size="18" fill="#697592">Серверный рендеринг вместо SPA: мини-приложение открывается по медленной сети быстрее, нечему ломаться в браузере MAX.</text>
  <text x="64" y="850" font-size="18" fill="#697592">Три процесса из одного образа: бот не встаёт, пока идёт рассылка; рассылка переживает перезапуск веба; сборка при этом одна.</text>
  <text x="64" y="878" font-size="18" fill="#697592">Единственный внешний сервис — MAX. Всё остальное внутри compose, поэтому решение поднимается одной командой.</text>
</svg>
