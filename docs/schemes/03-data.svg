<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Gilroy, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475578"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#fafbfd"/>

  <text x="64" y="72" font-size="38" font-weight="700" fill="#0c1427">Схема данных</text>
  <text x="64" y="106" font-size="20" fill="#697592">Восемь таблиц PostgreSQL. Стрелка — внешний ключ. Синим выделено то, что человек создаёт сам.</text>

  <text x="64" y="146" font-size="16" font-weight="700" fill="#475578">ЧТО ПОКАЗЫВАЕМ</text>
  <text x="460" y="146" font-size="16" font-weight="700" fill="#475578">КТО СМОТРИТ</text>
  <text x="814" y="146" font-size="16" font-weight="700" fill="#264ffc">ЧТО ЧЕЛОВЕК ВЫБРАЛ</text>
  <text x="1204" y="146" font-size="16" font-weight="700" fill="#475578">СЛУЖЕБНОЕ</text>

  <!-- windows -->
  <rect x="64" y="160" width="372" height="304" rx="20" fill="#ffffff" stroke="#475578" stroke-width="2"/>
  <rect x="64" y="160" width="372" height="48" rx="20" fill="#475578"/>
  <rect x="64" y="188" width="372" height="20" fill="#475578"/>
  <text x="88" y="192" font-size="20" font-weight="700" fill="#ffffff">windows · окна записи</text>
  <text x="88" y="238" font-size="16" fill="#0c1427">title, topic, district, format</text>
  <text x="88" y="264" font-size="16" fill="#264ffc">venue_id → venues</text>
  <text x="88" y="290" font-size="16" fill="#0c1427">starts_at — когда событие</text>
  <text x="88" y="316" font-size="16" fill="#0c1427">reg_opens_at — когда запись</text>
  <text x="88" y="342" font-size="16" fill="#0c1427">reg_closes_at — до когда</text>
  <text x="88" y="368" font-size="16" fill="#0c1427">eligibility[] — кому положено</text>
  <text x="88" y="394" font-size="15" fill="#0c1427">conditions, documents[], register_url</text>
  <text x="88" y="420" font-size="15" fill="#697592">source_name, source_url, checked_at</text>
  <text x="88" y="446" font-size="15" fill="#697592">demo_for — личное демо-окно</text>

  <!-- venues -->
  <rect x="64" y="504" width="372" height="140" rx="20" fill="#ffffff" stroke="#475578" stroke-width="2"/>
  <rect x="64" y="504" width="372" height="48" rx="20" fill="#475578"/>
  <rect x="64" y="532" width="372" height="20" fill="#475578"/>
  <text x="88" y="536" font-size="20" font-weight="700" fill="#ffffff">venues · площадки</text>
  <text x="88" y="582" font-size="16" fill="#0c1427">name, district, address</text>
  <text x="88" y="608" font-size="16" fill="#0c1427">url, image_url</text>
  <text x="88" y="632" font-size="15" fill="#697592">20 реальных площадок Москвы</text>

  <!-- benefit_rules -->
  <rect x="64" y="684" width="372" height="184" rx="20" fill="#ffffff" stroke="#475578" stroke-width="2"/>
  <rect x="64" y="684" width="372" height="48" rx="20" fill="#475578"/>
  <rect x="64" y="712" width="372" height="20" fill="#475578"/>
  <text x="88" y="716" font-size="20" font-weight="700" fill="#ffffff">benefit_rules · льготные дни</text>
  <text x="88" y="762" font-size="16" fill="#264ffc">venue_id → venues</text>
  <text x="88" y="788" font-size="16" fill="#0c1427">categories[] — кому положено</text>
  <text x="88" y="814" font-size="16" fill="#0c1427">weekday + nth — правило повторения</text>
  <text x="88" y="840" font-size="15" fill="#697592">дат не храним — считаем при показе</text>

  <path d="M250 504 L250 470" stroke="#475578" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M250 644 L250 678" stroke="#475578" stroke-width="2.5" fill="none" marker-end="url(#a)"/>

  <!-- users -->
  <rect x="460" y="380" width="330" height="250" rx="20" fill="#ebf1fe" stroke="#264ffc" stroke-width="2"/>
  <rect x="460" y="380" width="330" height="48" rx="20" fill="#264ffc"/>
  <rect x="460" y="408" width="330" height="20" fill="#264ffc"/>
  <text x="484" y="412" font-size="20" font-weight="700" fill="#ffffff">users · люди</text>
  <text x="484" y="458" font-size="16" fill="#0c1427">id — user_id в MAX</text>
  <text x="484" y="484" font-size="16" fill="#0c1427">first_name</text>
  <text x="484" y="510" font-size="16" fill="#0c1427">category — льгота</text>
  <text x="484" y="536" font-size="16" fill="#0c1427">role — user | editor</text>
  <text x="484" y="562" font-size="16" fill="#0c1427">blocked, onboarded</text>
  <text x="484" y="588" font-size="15" fill="#697592">asking, replying_to — /admin</text>
  <text x="484" y="614" font-size="15" fill="#697592">телефона и почты не храним</text>

  <!-- reminders -->
  <rect x="814" y="190" width="366" height="156" rx="20" fill="#ebf1fe" stroke="#264ffc" stroke-width="2"/>
  <rect x="814" y="190" width="366" height="48" rx="20" fill="#264ffc"/>
  <rect x="814" y="218" width="366" height="20" fill="#264ffc"/>
  <text x="838" y="222" font-size="20" font-weight="700" fill="#ffffff">reminders · сердечко</text>
  <text x="838" y="268" font-size="16" fill="#264ffc">user_id → users</text>
  <text x="838" y="294" font-size="16" fill="#264ffc">window_id → windows</text>
  <text x="838" y="320" font-size="15" fill="#0c1427">muted — ползунок в «Уведомлениях»</text>

  <!-- subscriptions -->
  <rect x="814" y="386" width="366" height="156" rx="20" fill="#ebf1fe" stroke="#264ffc" stroke-width="2"/>
  <rect x="814" y="386" width="366" height="48" rx="20" fill="#264ffc"/>
  <rect x="814" y="414" width="366" height="20" fill="#264ffc"/>
  <text x="838" y="418" font-size="20" font-weight="700" fill="#ffffff">subscriptions · подписки</text>
  <text x="838" y="464" font-size="16" fill="#264ffc">user_id → users</text>
  <text x="838" y="490" font-size="15" fill="#0c1427">filter (jsonb) — сохранённый фильтр:</text>
  <text x="838" y="516" font-size="15" fill="#697592">темы, округа, форматы, вид события</text>

  <!-- notifications -->
  <rect x="814" y="582" width="366" height="156" rx="20" fill="#ffffff" stroke="#475578" stroke-width="2"/>
  <rect x="814" y="582" width="366" height="48" rx="20" fill="#475578"/>
  <rect x="814" y="610" width="366" height="20" fill="#475578"/>
  <text x="838" y="614" font-size="20" font-weight="700" fill="#ffffff">notifications · отправленное</text>
  <text x="838" y="660" font-size="16" fill="#264ffc">user_id → users</text>
  <text x="838" y="686" font-size="16" fill="#0c1427">key — например reg_open:w12</text>
  <text x="838" y="712" font-size="15" fill="#697592">пишется до отправки — защита от дубля</text>

  <!-- audit_log -->
  <rect x="1204" y="190" width="332" height="212" rx="20" fill="#ffffff" stroke="#475578" stroke-width="2"/>
  <rect x="1204" y="190" width="332" height="48" rx="20" fill="#475578"/>
  <rect x="1204" y="218" width="332" height="20" fill="#475578"/>
  <text x="1228" y="222" font-size="20" font-weight="700" fill="#ffffff">audit_log · журнал правок</text>
  <text x="1228" y="268" font-size="16" fill="#0c1427">at, user_id — кто и когда</text>
  <text x="1228" y="294" font-size="15" fill="#0c1427">action — создал | изменил | удалил</text>
  <text x="1228" y="320" font-size="16" fill="#0c1427">entity, entity_id — что именно</text>
  <text x="1228" y="346" font-size="16" fill="#0c1427">title — снимок названия</text>
  <text x="1228" y="374" font-size="15" fill="#697592">без внешних ключей — удалённая</text>
  <text x="1228" y="394" font-size="15" fill="#697592">запись остаётся читаемой</text>

  <!-- notes -->
  <rect x="1204" y="442" width="332" height="426" rx="20" fill="#f3f6f9" stroke="#d6dae2" stroke-width="2"/>
  <text x="1228" y="482" font-size="19" font-weight="700" fill="#0c1427">Что из этого где работает</text>
  <text x="1228" y="518" font-size="15" fill="#697592">Лента и каталог — venues, windows,</text>
  <text x="1228" y="540" font-size="15" fill="#697592">benefit_rules и категория из users.</text>
  <text x="1228" y="574" font-size="15" fill="#697592">Кому писать — reminders и подписки</text>
  <text x="1228" y="596" font-size="15" fill="#697592">против поля eligibility.</text>
  <text x="1228" y="630" font-size="15" fill="#697592">Не писать дважды — notifications.</text>
  <text x="1228" y="664" font-size="15" fill="#697592">Кто правил данные — audit_log.</text>
  <text x="1228" y="698" font-size="15" fill="#697592">Права в админке — users.role и</text>
  <text x="1228" y="720" font-size="15" fill="#697592">главные из переменных среды.</text>
  <text x="1228" y="760" font-size="19" font-weight="700" fill="#0c1427">Миграции</text>
  <text x="1228" y="794" font-size="15" fill="#697592">CREATE TABLE IF NOT EXISTS и</text>
  <text x="1228" y="816" font-size="15" fill="#697592">ADD COLUMN IF NOT EXISTS: сколько</text>
  <text x="1228" y="838" font-size="15" fill="#697592">раз ни примени — результат один.</text>

  <path d="M440 300 L810 262" stroke="#475578" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M794 400 L810 312" stroke="#475578" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M794 450 L810 458" stroke="#475578" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M794 560 L810 654" stroke="#475578" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
</svg>
