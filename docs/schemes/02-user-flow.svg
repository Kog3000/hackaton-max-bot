<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Gilroy, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475578"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#264ffc"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#fafbfd"/>

  <text x="64" y="76" font-size="38" font-weight="700" fill="#0c1427">Основной пользовательский путь</text>
  <text x="64" y="112" font-size="20" fill="#697592">От первого запуска до сообщения в чате в момент открытия записи</text>

  <text x="64" y="182" font-size="17" font-weight="700" fill="#264ffc">ЧАТ С БОТОМ</text>
  <line x1="64" y1="196" x2="1536" y2="196" stroke="#e3e7ee" stroke-width="2"/>

  <rect x="64" y="218" width="300" height="130" rx="22" fill="#ebf1fe" stroke="#264ffc" stroke-width="2"/>
  <circle cx="98" cy="252" r="17" fill="#264ffc"/>
  <text x="98" y="259" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="126" y="259" font-size="21" font-weight="700" fill="#0c1427">/start</text>
  <text x="90" y="296" font-size="17" fill="#697592">Приветствие и кнопка</text>
  <text x="90" y="322" font-size="17" fill="#697592">«Открыть Aperio»</text>

  <rect x="400" y="218" width="1136" height="130" rx="22" fill="#f3f6f9" stroke="#d6dae2" stroke-width="2"/>
  <text x="430" y="258" font-size="19" font-weight="700" fill="#0c1427">Здесь же — проверка всего пути за минуту</text>
  <text x="430" y="292" font-size="17" fill="#697592">Команда /demo (или кнопка «Прислать тестовое уведомление» в профиле) создаёт личное окно записи,</text>
  <text x="430" y="318" font-size="17" fill="#697592">которое откроется через 60 секунд. Уведомление придёт только вам — остальных оно не побеспокоит.</text>

  <text x="64" y="392" font-size="17" font-weight="700" fill="#475578">МИНИ-ПРИЛОЖЕНИЕ</text>
  <line x1="64" y1="406" x2="1536" y2="406" stroke="#e3e7ee" stroke-width="2"/>

  <path d="M214 348 L214 424" stroke="#264ffc" stroke-width="2.5" fill="none" marker-end="url(#ab)"/>

  <rect x="64" y="428" width="300" height="146" rx="22" fill="#ffffff" stroke="#d6dae2" stroke-width="2"/>
  <circle cx="98" cy="462" r="17" fill="#475578"/>
  <text x="98" y="469" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="126" y="469" font-size="21" font-weight="700" fill="#0c1427">Категория льготы</text>
  <text x="90" y="506" font-size="17" fill="#697592">Студент, многодетная</text>
  <text x="90" y="532" font-size="17" fill="#697592">семья, пенсионер…</text>
  <text x="90" y="558" font-size="17" fill="#264ffc">можно пропустить</text>

  <path d="M368 502 L412 502" stroke="#475578" stroke-width="2.5" fill="none" marker-end="url(#a)"/>

  <rect x="416" y="428" width="300" height="146" rx="22" fill="#ffffff" stroke="#d6dae2" stroke-width="2"/>
  <circle cx="450" cy="462" r="17" fill="#475578"/>
  <text x="450" y="469" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="478" y="469" font-size="21" font-weight="700" fill="#0c1427">Лента</text>
  <text x="442" y="506" font-size="17" fill="#697592">Льготные дни музеев</text>
  <text x="442" y="532" font-size="17" fill="#697592">и окна записи —</text>
  <text x="442" y="558" font-size="17" fill="#697592">сразу под вашу льготу</text>

  <path d="M720 502 L764 502" stroke="#475578" stroke-width="2.5" fill="none" marker-end="url(#a)"/>

  <rect x="768" y="428" width="300" height="146" rx="22" fill="#ffffff" stroke="#d6dae2" stroke-width="2"/>
  <circle cx="802" cy="462" r="17" fill="#475578"/>
  <text x="802" y="469" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="830" y="469" font-size="21" font-weight="700" fill="#0c1427">Фильтры</text>
  <text x="794" y="506" font-size="17" fill="#697592">Тема, округ, формат →</text>
  <text x="794" y="532" font-size="17" fill="#697592">«Уведомлять о таком»:</text>
  <text x="794" y="558" font-size="17" fill="#697592">фильтр стал подпиской</text>

  <path d="M1072 502 L1116 502" stroke="#475578" stroke-width="2.5" fill="none" marker-end="url(#a)"/>

  <rect x="1120" y="428" width="300" height="146" rx="22" fill="#ffffff" stroke="#d6dae2" stroke-width="2"/>
  <circle cx="1154" cy="462" r="17" fill="#475578"/>
  <text x="1154" y="469" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="1182" y="469" font-size="21" font-weight="700" fill="#0c1427">Карточка</text>
  <text x="1146" y="506" font-size="17" fill="#697592">Сердечко — напомнить,</text>
  <text x="1146" y="532" font-size="17" fill="#697592">«Позвать компанию» —</text>
  <text x="1146" y="558" font-size="17" fill="#697592">ссылка в чат MAX</text>

  <path d="M1200 578 L1200 706" stroke="#264ffc" stroke-width="2.5" fill="none" marker-end="url(#ab)"/>
  <text x="1182" y="628" font-size="17" fill="#264ffc" text-anchor="end">наступило время</text>
  <text x="1182" y="652" font-size="17" fill="#264ffc" text-anchor="end">открытия записи</text>

  <path d="M1340 706 L1340 578" stroke="#697592" stroke-width="2.5" fill="none" stroke-dasharray="7 7" marker-end="url(#a)"/>
  <text x="1358" y="628" font-size="17" fill="#697592">один тап —</text>
  <text x="1358" y="652" font-size="17" fill="#697592">и снова в карточке</text>

  <text x="64" y="682" font-size="17" font-weight="700" fill="#264ffc">ЧАТ С БОТОМ</text>
  <line x1="64" y1="696" x2="1536" y2="696" stroke="#e3e7ee" stroke-width="2"/>

  <rect x="1120" y="722" width="300" height="130" rx="22" fill="#ebf1fe" stroke="#264ffc" stroke-width="2"/>
  <circle cx="1154" cy="756" r="17" fill="#264ffc"/>
  <text x="1154" y="763" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
  <text x="1182" y="763" font-size="21" font-weight="700" fill="#0c1427">Уведомление</text>
  <text x="1146" y="800" font-size="17" fill="#697592">«Открылась запись…»</text>
  <text x="1146" y="826" font-size="17" fill="#697592">и кнопка со ссылкой</text>

  <rect x="64" y="722" width="1004" height="130" rx="22" fill="#ffffff" stroke="#d6dae2" stroke-width="2"/>
  <text x="94" y="762" font-size="19" font-weight="700" fill="#0c1427">Что ещё приходит в чат по этому же событию</text>
  <text x="94" y="796" font-size="17" fill="#697592">За сутки до закрытия записи · за сутки до самого события · накануне льготного дня вашего музея.</text>
  <text x="94" y="822" font-size="17" fill="#697592">Любое из них выключается ползунком в «Уведомлениях», само событие при этом остаётся в списке.</text>
</svg>
